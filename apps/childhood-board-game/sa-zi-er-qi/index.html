<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仨子儿棋</title>
  <link rel="stylesheet" href="game.css">
  <script src="../../../js/baidu-analytics.js"></script>
  <script src="../../../js/common.js"></script>
  <script src="../../common/game-utils.js"></script>
</head>
<body>

  <!-- Mode Selection -->
  <div id="mode-selection" class="overlay">
    <div class="overlay-content">
      <h1 class="game-title">仨子儿棋</h1>
      <p class="subtitle">经典童年棋盘游戏</p>
      <div class="mode-buttons">
        <button id="btn-pvp" class="btn btn-pvp">双人对战</button>
        <button id="btn-pve" class="btn btn-pve">人机对战</button>
      </div>
    </div>
  </div>

  <!-- RPS Selection -->
  <div id="rps-section" class="overlay" style="display:none;">
    <div class="overlay-content">
      <h2>石头剪刀布 - 决定先手</h2>
      <div id="rps-pvp" style="display:none;">
      </div>
      <div id="rps-pve" style="display:none;">
        <div class="rps-player">
          <h3>你的选择</h3>
          <div class="rps-buttons">
            <button class="btn btn-rps" data-choice="rock">石头</button>
            <button class="btn btn-rps" data-choice="scissors">剪刀</button>
            <button class="btn btn-rps" data-choice="paper">布</button>
          </div>
        </div>
      </div>
      <div id="rps-result" class="rps-result"></div>
    </div>
  </div>

  <!-- Game Area -->
  <div id="game-area" style="display:none;">
    <div id="status-bar">
      <div class="status-item">
        <span class="label">当前行动方：</span>
        <span id="current-player" class="team-indicator">—</span>
      </div>
      <div class="status-item">
        <span class="label">回合：</span>
        <span id="turn-count">0</span>
      </div>
      <div class="status-item">
        <span class="label">阶段：</span>
        <span id="phase-text">布子阶段</span>
      </div>
    </div>

    <div id="game-main">
      <div id="board"></div>

      <div id="rules-panel">
        <h3>游戏规则</h3>
        <div class="rule-section">
          <h4>基本规则</h4>
          <ul>
            <li>三方棋盘（大、中、小三个正方形），共12个位置</li>
            <li>双方各6颗棋子</li>
            <li>先布子后走子，每次一步</li>
          </ul>
        </div>
        <div class="rule-section">
          <h4>吃子规则</h4>
          <ul>
            <li>沿连线形成三子连线时，吃掉对方一颗棋子</li>
            <li>连线包括正方形边和径向连线</li>
          </ul>
        </div>
        <div class="rule-section">
          <h4>胜利条件</h4>
          <ul>
            <li>将对方棋子减少到少于3颗</li>
          </ul>
        </div>
        <div id="rule-pve" class="rule-section">
          <h4>人机模式</h4>
          <ul>
            <li>AI会尽力获胜或阻止你</li>
          </ul>
        </div>
      </div>
    </div>

    <div id="message"></div>
  </div>

  <!-- Game Over -->
  <div id="game-over" class="overlay" style="display:none;">
    <div class="overlay-content">
      <h2 id="winner-text">游戏结束</h2>
      <button id="btn-restart" class="btn btn-restart">重新开始</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
