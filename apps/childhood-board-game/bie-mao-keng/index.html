<body>

  <!-- Mode Selection -->
  <div id="mode-selection" class="overlay">
    <div class="overlay-content">
      <h1 class="game-title">憋茅坑</h1>
      <p class="subtitle">经典童年棋盘游戏</p>
      <div class="mode-buttons">
        <button id="btn-pvp" class="btn btn-pvp">双人对战</button>
        <button id="btn-pve" class="btn btn-pve">人机对战</button>
        <button id="btn-online" class="btn btn-online">联网对战</button>
      </div>
    </div>
  </div>

  <!-- RPS Selection -->
  <div id="rps-section" class="overlay" style="display:none;">
    <div class="overlay-content">
      <h2>石头剪刀布 - 决定先手</h2>
      <div id="rps-pvp" style="display:none;">
      </div>
      <div id="rps-pve" style="display:none;">
        <div class="rps-player">
          <h3>你的选择</h3>
          <div class="rps-buttons">
            <button class="btn btn-rps" data-choice="rock">✊ 石头</button>
            <button class="btn btn-rps" data-choice="scissors">✌️ 剪刀</button>
            <button class="btn btn-rps" data-choice="paper">🖐️ 布</button>
          </div>
        </div>
      </div>
      <div id="rps-result" class="rps-result"></div>
    </div>
  </div>

  <!-- Online RPS Selection -->
  <div id="rps-online" class="overlay" style="display:none;">
    <div class="overlay-content">
      <h2>石头剪刀布 - 决定先手</h2>
      <div class="rps-player">
        <h3>你的选择</h3>
        <div class="rps-buttons" id="rps-online-buttons">
          <button class="btn btn-rps" data-player="online" data-choice="rock">✊ 石头</button>
          <button class="btn btn-rps" data-player="online" data-choice="scissors">✌️ 剪刀</button>
          <button class="btn btn-rps" data-player="online" data-choice="paper">🖐️ 布</button>
        </div>
        <p id="rps-online-status" class="rps-status">请选择</p>
      </div>
      <div id="rps-online-result" class="rps-result"></div>
    </div>
  </div>

  <!-- Game Area -->
  <div id="game-area" style="display:none;">
    <div id="status-bar">
      <div class="status-item">
        <span class="label">当前行动方：</span>
        <span id="current-player" class="team-indicator">—</span>
      </div>
      <div class="status-item">
        <span class="label">回合：</span>
        <span id="turn-count">0</span>
      </div>
      <div class="status-item">
        <span id="label-a" class="label">A 可走：</span>
        <span id="moves-a">0</span>
      </div>
      <div class="status-item">
        <span id="label-b" class="label">B 可走：</span>
        <span id="moves-b">0</span>
      </div>
    </div>

    <div id="game-main">
      <div id="board"></div>

      <div id="rules-panel">
        <h3>游戏规则</h3>
        <div class="rule-section">
          <h4>基本规则</h4>
          <ul>
            <li>正方形棋盘，对角线交叉，右侧有"茅坑"</li>
            <li>双方各2颗棋子，初始布于棋盘四角</li>
            <li>轮流沿连线移动一步（含对角线）</li>
            <li>先手第一步不能一步将对方憋死</li>
          </ul>
        </div>
        <div class="rule-section">
          <h4>胜利条件</h4>
          <ul>
            <li>当一方无法移动时，对方获胜</li>
            <li>即将对方逼入死角即为"憋"</li>
          </ul>
        </div>
        <div id="rule-pve" class="rule-section">
          <h4>人机模式</h4>
          <ul>
            <li>AI会尽力获胜或阻止你</li>
          </ul>
        </div>
      </div>
    </div>

    <div id="message"></div>
  </div>

  <!-- Game Over -->
  <div id="game-over" class="overlay" style="display:none;">
    <div class="overlay-content">
      <h2 id="winner-text">游戏结束</h2>
      <button id="btn-restart" class="btn btn-restart">重新开始</button>
    </div>
  </div>

  <script src="ai.js"></script>
