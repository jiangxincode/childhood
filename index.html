<!-- 一级入口选择器 -->
<div class="category-selector">

    <div class="category-cards">
        <div class="category-card active" data-category="card">
            <div class="card-glow"></div>
            <div class="card-content">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="2" y="2" width="20" height="20" rx="3"/>
                        <path d="M12 8v8M8 12h8"/>
                    </svg>
                </div>
                <h2 class="card-title">卡片游戏</h2>
                <p class="card-desc">经典童年卡牌对战</p>
            </div>
            <div class="card-border"></div>
        </div>
        <div class="category-card" data-category="chess">
            <div class="card-glow"></div>
            <div class="card-content">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="10"/>
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>

</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@2.2.4/dist/jquery.min.js" type="text/javascript"></script>
<script src="js/jquery-yys-slider.js" type="text/javascript"></script>
<script type="text/javascript">
$(function(){
    // 一级入口切换逻辑
    $('.category-card').on('click', function(){
        var category = $(this).data('category');

        // 更新选中状态
        $('.category-card').removeClass('active');
        $(this).addClass('active');

        // 切换显示区域
        $('.game-section').removeClass('active');
        if (category === 'card') {
            $('#card-section').addClass('active');
        } else {
            $('#chess-section').addClass('active');
        }
    });

    // 初始化卡片游戏轮播
    $('#card-section .gallery_container').gallery_slider({imgNum: 6});
    $('#card-section .content-part.part-tese').addClass('show');

    // 初始化棋类游戏轮播
    $('#chess-section .gallery_container').gallery_slider({imgNum: 8});
    $('#chess-section .content-part.part-tese').addClass('show');

    // 桌面端：点击中间图片跳转
    $('.gallery_container').on('click', '.front_side', function(){
        var href = $(this).data('href');
        if (href) window.location.href = href;
    });

    // 移动端：所有卡片均可点击跳转
    $('.gallery_container').on('click', '.gallery_item', function(){
        if ($(window).width() <= 860) {
            var href = $(this).data('href');
            if (href) window.location.href = href;
        }
    });
})
</script>

</body>
</html>
