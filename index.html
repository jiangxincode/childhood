<script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js" integrity="sha384-fgGyf7Mo7DURSOMnOy7ed+dkq5Job205Gnzu6QIg0BOHKaqt4D76Dt8VlDCzcMHV" crossorigin="anonymous"></script>
<script src="js/jquery-yys-slider.js" type="text/javascript"></script>
<script type="text/javascript">
$(function(){
    // Category switching logic
    $('.category-card').on('click', function(){
        var category = $(this).data('category');

        // Update selected state
        $('.category-card').removeClass('active');
        $(this).addClass('active');

        // Switch display area
        $('.game-section').removeClass('active');
        $('#' + category + '-section').addClass('active');
    });

    // Initialize card game carousel
    $('#card-section .gallery_container').gallery_slider({imgNum: 6});
    $('#card-section .content-part.part-tese').addClass('show');

    // Initialize board game carousel
    $('#board-section .gallery_container').gallery_slider({imgNum: 9});
    $('#board-section .content-part.part-tese').addClass('show');

    // Initialize dice game carousel
    $('#dice-section .gallery_container').gallery_slider({imgNum: 1});
    $('#dice-section .content-part.part-tese').addClass('show');

    // Desktop: click center image to navigate
    $('.gallery_container').on('click', '.front_side', function(){
        var href = $(this).data('href');
        if (href) window.location.href = href;
    });

    // Mobile: all cards are clickable
    $('.gallery_container').on('click', '.gallery_item', function(){
        if ($(window).width() <= 860) {
            var href = $(this).data('href');
            if (href) window.location.href = href;
        }
    });
})
</script>
