[package]
name = "childhood"
version = "1.0.0"
description = "Childhood classic games collection"
authors = ["JiangXin"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/AloysHF/childhood"
rust-version = "1.77"

[lib]
name = "childhood_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
