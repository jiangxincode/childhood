name: Desktop Release

# Build native desktop installers (Windows / macOS / Linux) with Tauri.
#
# Triggers:
#   - Pushing a tag that starts with "v" (e.g. v1.0.0): the job creates a draft
#     GitHub Release and uploads installers as assets.
#   - Manual dispatch from the Actions tab: builds the binaries on every
#     platform without publishing, useful for verifying the matrix.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # macOS Intel
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          # Linux x86_64 (.deb / .rpm / .AppImage)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          # Windows x86_64 (NSIS .exe; MSI/WiX skipped due to known issues
          # with non-ASCII productName + multi-language MSI bundling)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Generate platform icons
        run: npm run tauri:icon

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "童年游戏合集 ${{ github.ref_name }}"
          releaseBody: "本次发行包含 Windows、macOS、Linux 原生安装包，详细变更见 commit 历史。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
